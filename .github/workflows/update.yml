name: Auto-update Claude Science

on:
  schedule:
    # Run daily at 7:41 AM UTC to catch new releases.
    - cron: '41 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@v21

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Check for updates
        id: check
        run: |
          if scripts/update.sh --check; then
            echo "No update available."
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "update_available=true" >> "$GITHUB_OUTPUT"

      - name: Run update script
        if: steps.check.outputs.update_available == 'true'
        run: scripts/update.sh

      - name: Create pull request
        if: steps.check.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "claude-science: bump to latest upstream release"
          title: "claude-science: auto-update to latest release"
          body: |
            Automated update: upstream released a new version of Claude Science.
          branch: auto/claude-science-update
          delete-branch: true
          labels: |
            automated
            update
